<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; base-uri 'self'; form-action 'none'">
<title>Frontier Analyst</title>
<link rel="stylesheet" href="viewer.css">
<script src="viewer.js" defer></script>
</head>
<body>
<header class="mast">
  <a class="mast__brand" href="#/">
    <svg class="mast__owl motif" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5 8 7.5h8l3-3V13c0 4.4-3.1 7.5-7 7.5S5 17.4 5 13Z"/><circle cx="9.3" cy="11.4" r="2.1"/><circle cx="14.7" cy="11.4" r="2.1"/><path d="m11.2 14.6.8 1.3.8-1.3"/></svg>
    <span class="mast__title">Frontier Analyst</span>
  </a>
  <span class="mast__motto motif" lang="grc">ἀλήθεια</span>
  <button class="mast__lock" id="lock" hidden>Lock</button>
</header>

<main id="app">
  <section class="gate" id="gate">
    <p class="label">Private briefing</p>
    <h1 class="gate__title">Enter the passphrase to read.</h1>
    <form id="unlock" autocomplete="on">
      <input type="text" name="username" value="frontier-analyst" autocomplete="username" hidden>
      <label class="sr" for="pw">Passphrase</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="six words" required>
      <button type="submit" id="go">Unlock</button>
    </form>
    <p class="gate__msg" id="msg" role="status" aria-live="polite"></p>
    <p class="gate__note">Everything on this site is encrypted. The passphrase is checked in your browser and never leaves it.</p>
  </section>

  <section class="archive" id="archive" hidden></section>

  <section class="reader" id="reader" hidden>
    <nav class="reader__bar">
      <a href="#/" class="reader__back">&larr; All issues</a>
      <button id="pdf" class="reader__pdf">Download PDF</button>
    </nav>
    <iframe id="issue" title="Issue" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </section>
</main>
</body>
</html>
